[project]
name = "garant"
version = "2.0.0"
description = "Garant — Telegram Mini App escrow service (SQLAlchemy 2 rewrite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "aiogram>=3.7,<4",
    "AsyncPayments==1.4.0",
    "websockets==12.0",
    "python-multipart==0.0.9",
    "bcrypt==4.2.0",
    "PyJWT==2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
