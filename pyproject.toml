[project]
name = "garant"
version = "2.0.0"
description = "Garant — Telegram Mini App escrow service (SQLAlchemy 2 rewrite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.13.3",
    "asyncpg==0.30.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "aiogram>=3.7,<4",
    "httpx>=0.27,<1",
    "websockets==12.0",
    "python-multipart==0.0.18",
    "bcrypt==4.2.0",
    "PyJWT==2.9.0",
    "redis==5.2.0",
    "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "fakeredis[lua]>=2.26",
    # CI-3 — backend type-checking gate. Pinned at >=1.1 so the
    # ``pyrightconfig.json`` schema fields we rely on
    # (``typeCheckingMode``, ``reportInvalidTypeForm``, etc.) are
    # recognised; node ships transitively with the pip package.
    "pyright>=1.1.380",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# V12-M1 — ``ignore = ["E501"]`` used to make ``line-length`` an
# inert decoration; restore the hard cap so newly-written lines that
# exceed 100 chars fail lint instead of slipping in. ``ruff format``
# still owns reflowing existing code.

[tool.ruff.lint.per-file-ignores]
# V12-L8 — Alembic revisions are autogenerated and fan out wide
# ``op.create_table`` / ``op.alter_column`` calls whose argument lists
# routinely cross the 100-char cap. Hand-reflowing them just to satisfy
# the linter adds churn against the next autogen and obscures the
# generated structure. Suppress E501 inside ``alembic/versions/`` only;
# everything else still has to fit.
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# V12-M2 — narrow the deprecation noise filter. The previous
# wholesale ``ignore::DeprecationWarning`` /
# ``ignore::PendingDeprecationWarning`` made every SQLAlchemy 2.x,
# Pydantic v2, FastAPI, aiogram and stdlib Python 3.13/3.14
# deprecation invisible — so an upstream migration warning we needed
# to act on (e.g. ``MovedIn20Warning``) silently passed CI for the
# entire window in which it would have been easy to fix. We now:
#
# 1. ``error`` for every ``DeprecationWarning`` and
#    ``PendingDeprecationWarning`` from our own code by default so a
#    new internal deprecation lights up immediately.
# 2. Re-allow the known-noisy third-party sources we cannot do
#    anything about in this repo (aiogram polling teardown, asyncio
#    in 3.12/3.13, websockets handshake helper). Each ignore is
#    scoped to a single module via the ``module:`` filter syntax so
#    a new aiogram warning outside the listed path still trips the
#    gate.
#
# Format reminder: ``action:message:category:module:lineno`` — empty
# components default to "match anything", and the ``module`` filter
# uses a regex anchored at the start of the dotted module path.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # aiogram 3.x raises a DeprecationWarning on every polling
    # shutdown because dispatcher.stop_polling lands inside an
    # ``asyncio.gather`` whose return type changed; nothing in our
    # code reaches that path, the warning is purely about aiogram's
    # own teardown.
    "ignore::DeprecationWarning:aiogram",
    # asyncio's own ``get_event_loop`` deprecation fires from
    # asyncpg / fakeredis during fixture teardown on Python 3.12+;
    # we can't migrate either library off the legacy API from this
    # repo.
    "ignore::DeprecationWarning:asyncio",
    "ignore::DeprecationWarning:asyncpg",
    "ignore::DeprecationWarning:fakeredis",
    # websockets ``loop`` parameter deprecation surfaces during the
    # uvicorn-driven WS test server bring-up; the parameter is
    # threaded through by websockets itself, not by us.
    "ignore::DeprecationWarning:websockets",
    # Pydantic v2 occasionally emits ``PydanticDeprecatedSince20``
    # for compatibility shims that we already migrated; the warning
    # comes from FastAPI's response-model machinery and is fixed
    # upstream in newer FastAPI versions.
    "ignore::DeprecationWarning:fastapi",
    "ignore::DeprecationWarning:pydantic",
    # ``starlette.formparsers`` imports ``multipart`` (the legacy
    # package name); the new ``python_multipart`` package warns on
    # import that the legacy name is deprecated. We already declare
    # ``python-multipart`` in ``pyproject.toml`` — the warning is
    # purely about starlette's import path which we don't control.
    "ignore::PendingDeprecationWarning:multipart",
    "ignore::PendingDeprecationWarning:starlette",
]
