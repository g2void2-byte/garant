# V12-M3 — automated dependency bumps for the frontend + backend
# pyproject.toml, plus the GitHub Actions used in ``.github/workflows``.
# Pre-fix every transitive bump propagated silently via the carets that
# ``frontend/package.json`` carried (and via ``pyproject.toml`` not
# being managed at all). Each ecosystem now produces grouped PRs once
# a week so reviewers can read one diff per bump and the lockfile stays
# the source of truth for the resolved versions.

version: 2
updates:
  # Frontend (npm) — package.json is pinned to exact versions (see
  # frontend/package.json::"//") so a manual edit can't sneak a minor
  # past review. Dependabot bumps the pinned versions and refreshes
  # package-lock.json in the same PR.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    groups:
      # React, TanStack and the telegram SDK move on their own cadence;
      # leaving ``major`` updates outside this group means a future
      # React 19 bump (V12-M12) arrives as a single, reviewable PR
      # instead of being smuggled in alongside @types/* churn.
      runtime:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      types:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@types/*"

  # Backend (pip / pyproject.toml). uv-style lockfiles aren't tracked
  # yet (V12-L4), so Dependabot uses the declared range in
  # ``pyproject.toml`` to choose candidate upgrades.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      backend:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # GitHub Actions used by ``.github/workflows``. Pinning the action
  # major (``actions/setup-node@v4``) is enough to avoid forced
  # rewrites; this stream picks up the floating minor/patch tags so
  # ``actions/setup-python@v5.x.y`` stays current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      gha:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
