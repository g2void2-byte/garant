name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# V12-L6 — cancel superseded runs on the same ref. Pre-fix a
# ``git push --force-with-lease`` after a rebase left the previous
# 10-minute backend/frontend/e2e fan-out running to completion before
# the new run picked up; the old runs were always stale (their commit
# isn't the tip anymore) so we just drop them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garant
          POSTGRES_PASSWORD: garant
          POSTGRES_DB: garant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://garant:garant@localhost:5432/garant
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: garant
      POSTGRES_PASSWORD: garant
      POSTGRES_ADMIN_DB: postgres
      POSTGRES_TEST_DB: garant_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend deps (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend/ tests/ alembic/

      - name: Alembic upgrade head (verify migrations apply cleanly)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # V12-M4 — call the package script so any future tweak (e.g.
      # turning on ``--incremental`` or pointing at a different
      # tsconfig) goes through one definition rather than diverging
      # between CI and developer machines. ``npm run typecheck`` runs
      # ``tsc --noEmit -p tsconfig.json`` which is the right behaviour
      # for a pure type-check; the previous ``npx tsc -b`` invocation
      # wrote ``.tsbuildinfo`` files and didn't actually fail when
      # ``noEmit`` was off in a referenced project.
      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit + component tests (vitest)
        run: npm run test:run

      - name: Build (vite)
        run: npx vite build

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      # Cache the Playwright browser binaries by the resolved
      # ``@playwright/test`` version so we only re-download Chromium
      # when the dependency is bumped.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium (Playwright)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E smoke (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
