repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the same major as ``ruff`` in [project.optional-dependencies].dev
    # so pre-commit's auto-fix matches what CI lints.
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix", "backend/", "tests/", "alembic/"]
        types: [python]
        pass_filenames: false
      - id: ruff-format
        args: ["backend/", "tests/", "alembic/"]
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint frontend
        # Audit §16.4.1 — pre-fix this just ran ``cd frontend && npm run
        # lint``, which on a fresh clone (no ``frontend/node_modules``
        # yet) hard-failed with ``eslint: command not found`` and gave
        # the developer no guidance. We now check for the install
        # artefact up-front: if it's there we run the linter as
        # before, and if it isn't we print a single actionable hint
        # ("run ``cd frontend && npm install``") and skip the hook
        # with exit 0. This matches how ruff-pre-commit handles
        # missing Python deps (skip rather than fail-the-commit) so a
        # fresh-clone ``git commit`` doesn't get blocked on
        # frontend-only setup the developer might not need yet.
        entry: bash -c 'if [ -d frontend/node_modules ]; then cd frontend && npm run lint; else echo "[eslint-frontend] frontend/node_modules missing — skipping. Run \"cd frontend && npm install\" to enable this hook." >&2; fi'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
